<!doctype html>
<html lang="{{ html_lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E1A">
<title>{{ title }}</title>
<meta name="description" content="{{ desc }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ texts['title'] }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ desc }}">
<meta property="og:image" content="{{ image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ url }}">
<meta property="og:locale" content="{{ {'ko': 'ko_KR', 'en': 'en_US', 'zh': 'zh_CN', 'ja': 'ja_JP'}[lang] }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/icon.png') }}">
<style>
  html, body { margin: 0; height: 100%; background: #0b0e1a; color: #e8e6f0;
    font-family: "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "PingFang SC", "Hiragino Sans", system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    background: radial-gradient(ellipse at 50% 30%, #1b2140 0%, #0b0e1a 70%); }
  main { width: min(640px, 100%); text-align: center; display: flex; flex-direction: column; gap: 16px; }
  img.card { width: 100%; border-radius: 14px; border: 2px solid #2a3150; }
  h1 { margin: 0; font-size: 26px; color: #ffe08a; }
  p { margin: 0; color: #9aa0bd; }
  a.btn { display: block; padding: 18px; border-radius: 12px; font-size: 20px; font-weight: 800; text-decoration: none;
    background: linear-gradient(180deg, #ffbf5e, #e88a2a); color: #2a1606; box-shadow: 0 3px 0 #7a3f10; }
</style>
</head>
<body>
<main>
  <img class="card" src="{{ image }}" alt="{{ title }}" width="1200" height="630">
  <h1>{{ title }}</h1>
  <p>{{ desc }}</p>
  <a class="btn" href="{{ play_url }}">{{ texts['share.cta'] }}</a>
</main>
</body>
</html>
