# /etc/nginx/sites-available/maze.duruwap.com
server {
    listen 80;
    server_name maze.duruwap.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name maze.duruwap.com;

    ssl_certificate     /etc/letsencrypt/live/maze.duruwap.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maze.duruwap.com/privkey.pem;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /scsrun/app/maze-in-dungeon/static/;
        # 앱이 ?v=<내용 해시> 를 붙이므로 오래 캐시해도 배포 즉시 새 파일을 받는다.
        # 버전이 없는 요청은 매번 재검증한다.
        if ($arg_v) { expires 30d; }
        if ($arg_v = "") { add_header Cache-Control "no-cache"; }
    }

    location / {
        proxy_pass http://127.0.0.1:15003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
