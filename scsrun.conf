# 미로 인 던전 기동 설정 (scripts/scs-run.sh 가 source 한다)
# 비밀값(SECRET_KEY, KAKAO_JS_KEY 등)은 여기 말고 프로젝트의 .env 에 둔다 (git 에 올리지 않음).

PORT=15003
HOST=127.0.0.1          # nginx 뒤에서만 접근
WORKERS=4
THREADS=2

# 서버 표준 경로 (APP_NAME = maze-in-dungeon)
DATA_DIR=/scsdat/app/maze-in-dungeon
LOG_DIR=/scslog/app/maze-in-dungeon
PID_DIR=/scsrun/pid

LOG_KEEP_DAYS=30        # 이보다 오래된 일별 로그는 기동 시 정리
HEALTH_TIMEOUT=20       # 기동 후 응답 확인 대기(초)
